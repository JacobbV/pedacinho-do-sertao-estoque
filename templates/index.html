<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e5">

  <title>Pedacinho do Sertão | Estoque</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-pedacinho.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <div class="screen-wrapper">
    <main class="mobile-frame">
      <!-- TOPO / CABEÇALHO -->
      <header class="app-header">
        <div class="brand-area">
          <div class="brand-logo-art">
            <svg viewBox="0 0 54 48" width="50" height="44" fill="none">
              <!-- Cacto verde escuro -->
              <path d="M12 36V12C12 9.8 10.2 8 8 8S4 9.8 4 12V25H2C0.9 25 0 25.9 0 27V29C0 31.8 2.2 34 5 34H8V44H16V36H12ZM16 20H18C19.1 20 20 19.1 20 18V15C20 12.2 17.8 10 15 10V20Z" fill="#2d5236"/>
              <!-- Sol de fundo -->
              <circle cx="34" cy="18" r="9" fill="#dca052" opacity="0.85"/>
              <!-- Casa sertaneja em xilogravura -->
              <path d="M26 30L38 20L50 30V44H26V30Z" fill="#c47844"/>
              <path d="M30 33H46V44H30V33Z" fill="#fbf7ef"/>
              <rect x="35" y="34" width="6" height="10" fill="#8c3e21"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">Pedacinho</span>
            <span class="brand-sub">do Sertão</span>
          </div>
        </div>

        <!-- Gravura do Sertão no canto superior direito -->
        <div class="header-illustration">
          <svg viewBox="0 0 170 120" preserveAspectRatio="none" class="sertao-art-svg">
            <defs>
              <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#df9a66"/>
                <stop offset="100%" stop-color="#ab5235"/>
              </linearGradient>
            </defs>
            <rect width="170" height="120" rx="22" fill="url(#skyGrad)"/>
            <!-- Sol com textura -->
            <circle cx="120" cy="46" r="28" fill="#fce09b" opacity="0.95"/>
            <!-- Pássaros no sertão -->
            <path d="M36 34 Q 40 30 45 34 Q 50 30 55 34" fill="none" stroke="#5a2212" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M22 44 Q 26 40 30 44 Q 34 40 38 44" fill="none" stroke="#5a2212" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Relevo / Dunas de barro -->
            <path d="M-10 120 Q 50 68 180 96 L 180 120 Z" fill="#863a23"/>
            <path d="M40 120 Q 105 84 180 108 L 180 120 Z" fill="#622413"/>
            <!-- Mandacaru silhueta -->
            <path d="M142 58 V 110 M134 76 H 142 M134 68 V 76 M150 82 H 142 M150 72 V 82" stroke="#3b1c11" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </header>

      <!-- SAUDAÇÃO -->
      <section class="greeting-section">
        <h1 class="greeting-name">Bom dia, Maria</h1>
        <p class="greeting-date" id="currentDate">terça-feira, 20 de outubro</p>
      </section>

      <!-- ABA 1: INÍCIO -->
      <div id="page-inicio" class="view-panel active">
        <section class="dashboard-block">
          <h2 class="section-title">Resumo do estoque</h2>
          <div class="summary-grid">
            <article class="stat-card stat-low" data-nav="estoque">
              <div class="stat-icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a44832" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                  <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
              </div>
              <strong class="stat-number" id="countLow">0</strong>
              <span class="stat-label">itens baixos</span>
            </article>

            <article class="stat-card stat-requests" data-nav="solicitacoes">
              <div class="stat-icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4d6b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                  <polyline points="10 9 9 9 8 9"/>
                </svg>
              </div>
              <strong class="stat-number" id="countRequests">0</strong>
              <span class="stat-label">solicitações</span>
            </article>

            <article class="stat-card stat-receive" data-nav="solicitacoes">
              <div class="stat-icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a07228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="1" y="3" width="15" height="13" rx="1"/>
                  <polygon points="16 8 20 8 23 11 23 16 16 16 8"/>
                  <circle cx="5.5" cy="18.5" r="2.5"/>
                  <circle cx="18.5" cy="18.5" r="2.5"/>
                </svg>
              </div>
              <strong class="stat-number" id="countReceive">0</strong>
              <span class="stat-label">compras a receber</span>
            </article>
          </div>
        </section>

        <!-- SEÇÃO COM OS 3 ITENS EXATOS -->
        <section class="dashboard-block attention-block">
          <h2 class="section-title">Precisa de atenção</h2>
          <div class="product-cards-list" id="attentionStockList">
            <!-- Renderizado dinamicamente via app.js -->
          </div>
        </section>

        <!-- BOTÃO SEMPRE VISÍVEL -->
        <button class="btn-primary-action" id="btnNovaSolicitacao" type="button">
          <span class="btn-icon-circle">+</span>
          <span>Nova solicitação</span>
        </button>
      </div>

      <!-- ABA 2: ESTOQUE COMPLETO -->
      <div id="page-estoque" class="view-panel">
        <section class="dashboard-block">
          <div class="view-header">
            <h2 class="section-title">Todos os Itens</h2>
            <input type="search" id="searchStock" class="search-input" placeholder="Buscar produto...">
          </div>
          <div class="product-cards-list" id="allStockList"></div>
        </section>
      </div>

      <!-- ABA 3: SOLICITAÇÕES -->
      <div id="page-solicitacoes" class="view-panel">
        <section class="dashboard-block">
          <h2 class="section-title">Solicitações de Compra</h2>
          <div class="product-cards-list" id="solicitacoesList"></div>
        </section>
      </div>

      <!-- ABA 4: PERFIL -->
      <div id="page-perfil" class="view-panel">
        <section class="dashboard-block">
          <h2 class="section-title">Perfil</h2>
          <div class="profile-card">
            <div class="profile-avatar">M</div>
            <div>
              <strong>Maria Oliveira</strong>
              <p style="margin: 2px 0 0; color: var(--text-muted); font-size: 13px;">Gestão de Estoque</p>
            </div>
          </div>
          <h3 class="section-title" style="margin-top: 24px;">Histórico recente</h3>
          <div class="product-cards-list" id="historicoList"></div>
        </section>
      </div>

      <!-- NAVEGAÇÃO INFERIOR -->
      <nav class="tab-bar" aria-label="Navegação">
        <button class="tab-button active" data-nav="inicio" type="button">
          <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span class="tab-label">Início</span>
        </button>
        <button class="tab-button" data-nav="estoque" type="button">
          <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
          <span class="tab-label">Estoque</span>
        </button>
        <button class="tab-button" data-nav="solicitacoes" type="button">
          <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span class="tab-label">Solicitações</span>
        </button>
        <button class="tab-button" data-nav="perfil" type="button">
          <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="tab-label">Perfil</span>
        </button>
      </nav>

      <!-- MODAL SOLICITAÇÃO -->
      <dialog id="requestDialog" class="modal-dialog">
        <form id="requestForm" method="dialog">
          <h3>Nova Solicitação</h3>
          <label>
            Produto
            <select id="requestProduct" required></select>
          </label>
          <label>
            Quantidade
            <input type="number" id="requestQuantity" step="any" min="0.1" required placeholder="Ex: 5">
          </label>
          <label>
            Observação
            <input type="text" id="requestNote" placeholder="Ex: Reposição almoço">
          </label>
          <div class="dialog-footer">
            <button type="button" class="btn-secondary" id="btnCancelDialog">Cancelar</button>
            <button type="submit" class="btn-submit">Enviar pedido</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
